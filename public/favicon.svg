<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="afGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5510" />
      <stop offset="50%" stop-color="#ff5a1a" />
      <stop offset="100%" stop-color="#ff2a6d" />
    </linearGradient>
    <linearGradient id="afGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="afGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff5510" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Glowing Rounded Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#afGrad)" filter="url(#afGlow)" />

  <!-- Subtle Top Highlight / Gloss -->
  <rect x="4" y="4" width="56" height="28" rx="14" fill="url(#afGloss)" />

  <!-- Inner Stroke -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Crisp 'AF' Monogram -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="27"
    font-weight="900"
    letter-spacing="-1px"
    fill="#ffffff"
  >AF</text>
</svg>
